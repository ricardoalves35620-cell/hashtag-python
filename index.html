<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- No maximum-scale: locking zoom fails WCAG 2.1 SC 1.4.4. iOS auto-zoom on
         focus is prevented by keeping inputs at >=16px, not by blocking the user. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b21b6" />
    <!--
      NO apple-mobile-web-app-capable / -status-bar-style here, deliberately.

      On iOS 26 those two legacy tags half-apply: content draws under the status bar, so
      env(safe-area-inset-top) reports 59px, but the standalone window is CREATED that much
      SHORT and anchored at the top. The result is a dead, unpaintable strip below the
      layout viewport — `position: fixed` clips at the viewport, so no CSS reaches it and
      the bottom bar appears to float above the screen edge. Diagnosed in a sibling project
      on 2026-07-29.

      Standalone mode comes from the web manifest instead — "display": "standalone" in the
      manifest vite-plugin-pwa generates — which is the modern path and sizes the window
      correctly. apple-mobile-web-app-title is harmless and stays.

      NOTE FOR ANY DEPLOY: the Add-to-Home-Screen wrapper caches these tags AT INSTALL TIME.
      An existing home-screen icon keeps the old window sizing forever. The icon has to be
      deleted and re-added from Safari, or the fix will look like it did nothing.
    -->
    <meta name="apple-mobile-web-app-title" content="#Python" />
    <meta name="description" content="Learn Python as a family — from beginner to expert" />
    <!-- The manifest link is injected by vite-plugin-pwa, which points at the
         generated /manifest.webmanifest. Hardcoding a second one here made the
         browser honour whichever came first and silently ignore the other. -->
    <title>Hashtag Python</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Safe-area diagnostic. Dormant unless the URL carries ?safearea=1.

      The same visible symptom — a bottom bar that does not reach the screen edge — has at
      least three different causes on iOS, and they need different fixes. Guessing costs
      hours; reading four numbers off the device costs a minute. It lives in index.html
      rather than in React so that it still runs if the app itself fails to boot, and it
      has to run INSIDE the installed app, because the fault it is looking for is in how
      iOS sizes that window and no desktop browser reproduces it.

        open the installed app, then navigate to  /?safearea=1

      Read the numbers against these three cases:

      A  innerHeight === screen.height - env(top)  AND  gap below bar === 0
         The window itself was created short. CSS cannot reach the strip. Caused by the
         legacy apple-mobile-web-app-* metas, which the home-screen icon CACHES AT INSTALL
         TIME — so the icon must be deleted and re-added after any fix.
      B  innerHeight is full  AND  gap below bar > 0
         A CSS bug: the inset is on an element that does not paint the bar's background,
         or the reserved height is hardcoded. audit:device-fit covers this class.
      C  visualViewport.height < innerHeight, only after the keyboard opened and closed
         A WebKit bug in iOS 26.0, fixed in 26.1. Update iOS first.
    -->
    <script>
      if (location.search.indexOf('safearea') !== -1) {
        (function () {
          var probe = document.createElement('div')
          probe.style.cssText = 'position:fixed;visibility:hidden;' +
            'padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px)'
          document.body.appendChild(probe)
          var computed = getComputedStyle(probe)
          var bar = document.querySelector('.hp-bottom-nav__inner')
          var box = bar && bar.getBoundingClientRect()
          var rows = {
            'env(bottom)': computed.paddingBottom,
            'env(top)': computed.paddingTop,
            'innerHeight': window.innerHeight,
            'visualViewport.height': Math.round((window.visualViewport || {}).height || -1),
            'screen.height': screen.height,
            'devicePixelRatio': window.devicePixelRatio,
            'bar bottom': box ? Math.round(box.bottom) : 'no bar on this page',
            'gap below bar': box ? Math.round(window.innerHeight - box.bottom) : '-',
            'standalone': matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
            'build': document.querySelector('meta[name="theme-color"]') ? 'loaded' : '?',
          }
          probe.remove()

          var panel = document.createElement('div')
          panel.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.82);' +
            'color:#fff;font:12px/1.6 monospace;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0;overflow:auto'
          panel.innerHTML = '<b>SAFE-AREA DIAGNOSTIC</b> — tap to close<br><br>' +
            Object.keys(rows).map(function (key) { return key + ' = <b>' + rows[key] + '</b>' }).join('<br>') +
            '<br><br>red band = the inset WebKit reports<br>green line = bottom of the layout viewport<br><br>' +
            'If the green line is not at the physical bottom of the screen, the window is the wrong size and no CSS can fix it (case A).'
          panel.onclick = function () { location.search = '' }
          document.body.appendChild(panel)

          var band = document.createElement('div')
          band.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:100000;' +
            'height:env(safe-area-inset-bottom,0px);background:rgba(255,0,0,.6);pointer-events:none'
          document.body.appendChild(band)

          var edge = document.createElement('div')
          edge.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:100001;height:3px;background:#22c55e;pointer-events:none'
          document.body.appendChild(edge)
        })()
      }
    </script>
  </body>
</html>
